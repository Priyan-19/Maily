services:
  db:
    image: postgres:15-alpine
    container_name: maily_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: maily123
      POSTGRES_DB: maily
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: maily_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - APP_NAME=Maily API
      - DEBUG=true
      - DATABASE_URL=postgresql+psycopg://postgres:maily123@db:5432/maily
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/auth/google/callback}
      - GOOGLE_SCOPES=${GOOGLE_SCOPES:-https://www.googleapis.com/auth/gmail.readonly}
      - GROQ_API_KEY=${GROQ_API_KEY}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: maily_frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
